<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Boundary Point Finder</title>
<meta name="theme-color" content="#1e3a2f">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#f4f2ec; --panel:#ffffff; --ink:#1a1a18; --muted:#6b6a63;
    --accent:#1e3a2f; --accent2:#c96a2e; --line:#d8d4c8; --danger:#a13a2e;
    --good:#2e6b3e; --btn-bg:#ffffff; --shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .hc-light{
    --bg:#ffffff; --panel:#ffffff; --ink:#000000; --muted:#333333;
    --accent:#003300; --accent2:#a34700; --line:#000000; --danger:#8b0000;
    --good:#004d00; --btn-bg:#ffffff; --shadow:0 0 0 1px #000;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:70px;
  }
  header{
    background:var(--accent); color:#fff; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20; box-shadow:var(--shadow);
  }
  header h1{font-size:1.05rem; margin:0; font-weight:600; letter-spacing:.2px;}
  header button.icon{
    background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer; padding:4px 8px;
  }
  main{padding:12px; max-width:640px; margin:0 auto;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .panel h2{font-size:.95rem; margin:0 0 10px 0; color:var(--accent); text-transform:uppercase; letter-spacing:.5px;}
  .hc-light .panel h2{color:var(--ink);}
  label{display:block; font-size:.85rem; color:var(--muted); margin:8px 0 4px;}
  input[type=text], textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:1rem; background:#fff; color:var(--ink); font-family:inherit;
  }
  textarea{resize:vertical; min-height:50px;}
  button{
    font-family:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
    padding:10px 14px; font-size:.95rem; background:var(--btn-bg); color:var(--ink);
  }
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  button.secondary{background:var(--accent2); color:#fff; border-color:var(--accent2);}
  button.danger{background:none; color:var(--danger); border-color:var(--danger);}
  button.full{width:100%;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .row > *{flex:1;}
  .gps-readout{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.9rem; background:#f0eee6; border:1px solid var(--line);
    border-radius:6px; padding:10px; margin:8px 0; line-height:1.5;
  }
  .hc-light .gps-readout{background:#fff;}
  .accbadge{
    display:inline-block; padding:2px 8px; border-radius:12px; font-size:.75rem; font-weight:600;
    color:#fff;
  }
  .acc-good{background:var(--good);}
  .acc-ok{background:#b8860b;}
  .acc-poor{background:var(--danger);}
  .photothumbs{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
  .photothumbs img{width:80px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .thumbwrap{position:relative;}
  .thumbwrap button.rm{
    position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff;
    border:none; border-radius:50%; width:22px; height:22px; font-size:.8rem; padding:0; line-height:1;
  }
  .pointcard{
    border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--panel);
    cursor:pointer;
  }
  .pointcard .pc-top{display:flex; justify-content:space-between; align-items:baseline;}
  .pointcard .pc-name{font-weight:600; font-size:1.02rem;}
  .pointcard .pc-meta{font-size:.8rem; color:var(--muted); margin-top:2px;}
  .pointcard .pc-thumbs{display:flex; gap:4px; margin-top:8px;}
  .pointcard .pc-thumbs img{width:48px; height:48px; object-fit:cover; border-radius:4px;}
  .empty-msg{text-align:center; color:var(--muted); padding:30px 10px; font-size:.9rem;}
  .navbar{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--panel);
    border-top:1px solid var(--line); z-index:20;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .navbar button{
    flex:1; background:none; border:none; border-radius:0; padding:10px 4px; font-size:.72rem;
    color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .navbar button.active{color:var(--accent); font-weight:700;}
  .navbar button .ic{font-size:1.25rem;}
  .view{display:none;}
  .view.active{display:block;}
  .compass-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 4px;}
  #compassArrow{transition:transform .15s ease-out;}
  .distance-big{font-size:2.3rem; font-weight:700; text-align:center; margin:6px 0; color:var(--accent);}
  .hc-light .distance-big{color:var(--ink);}
  .bearing-txt{text-align:center; color:var(--muted); font-size:.85rem;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:20px;
    font-size:.85rem; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:.95;}
  select{padding:8px; border-radius:6px; border:1px solid var(--line); font-size:.9rem; font-family:inherit;}
  hr.sep{border:none; border-top:2px solid var(--accent); margin:20px 0;}
  .small-btn{padding:6px 10px; font-size:.8rem;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  .confidence-tag{font-size:.75rem; padding:2px 8px; border-radius:10px; border:1px solid var(--line);}
  #appearanceOverlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90;
    align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto;
  }
  #appearanceOverlay.show{display:flex;}
  #appearancePanel{
    background:var(--panel); border-radius:12px; padding:16px; max-width:420px; width:100%;
    box-shadow:0 8px 24px rgba(0,0,0,0.3); color:var(--ink);
  }
  .color-row{
    display:flex; align-items:center; justify-content:space-between; padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .color-row label{margin:0; font-size:.9rem; color:var(--ink); flex:1;}
  .color-row input[type=color]{
    width:44px; height:32px; border:1px solid var(--line); border-radius:6px; padding:0; background:none; cursor:pointer;
  }
  .hdr-btns{display:flex; align-items:center; gap:2px;}
  #helpOverlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:95;
    align-items:flex-start; justify-content:center; padding:12px; overflow-y:auto;
  }
  #helpOverlay.show{display:flex;}
  #helpPanel{
    background:var(--panel); color:var(--ink); border-radius:12px; max-width:620px; width:100%;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  #helpPanel .help-top{
    position:sticky; top:0; z-index:1; background:var(--panel); border-radius:12px 12px 0 0;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  #helpPanel .help-top h2{margin:0; font-size:1.05rem; color:var(--accent);}
  .hc-light #helpPanel .help-top h2{color:var(--ink);}
  #helpBody{padding:8px 16px 18px;}
  .help-content{font-size:.92rem; line-height:1.5;}
  .help-content p{margin:6px 0;}
  .help-content ul, .help-content ol{margin:6px 0; padding-left:20px;}
  .help-content li{margin:3px 0;}
  .help-content details{border-bottom:1px solid var(--line); padding:6px 0;}
  .help-content summary{cursor:pointer; font-weight:600; padding:6px 0; color:var(--accent);}
  .hc-light .help-content summary{color:var(--ink);}
  .help-content code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.85em;
    background:rgba(127,127,127,0.15); padding:1px 5px; border-radius:4px;
  }
  .help-content .note{
    border-left:3px solid var(--accent2); padding:4px 10px; margin:8px 0; background:rgba(127,127,127,0.08);
  }
  .photothumbs img, .pc-thumbs img{cursor:pointer;}
  #lightbox{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92);
    z-index:100; align-items:center; justify-content:center; flex-direction:column;
  }
  #lightbox.show{display:flex;}
  #lightbox img{max-width:96vw; max-height:82vh; object-fit:contain; touch-action:none; user-select:none; -webkit-user-select:none; transform-origin:center center; will-change:transform;}
  #lightbox .lb-controls{
    display:flex; gap:10px; margin-top:14px; align-items:center;
  }
  #lightbox .lb-controls button{
    background:#fff; color:#000; border:none; border-radius:20px; padding:8px 16px; font-size:.85rem;
  }
  #lightbox .lb-count{color:#fff; font-size:.85rem;}
</style>
</head>
<body>

<header>
  <h1>📍 Boundary Point Finder</h1>
  <div class="hdr-btns">
    <button class="icon" id="btnHelp" title="Help">❓</button>
    <button class="icon" id="btnAppearance" title="Appearance">🎨</button>
  </div>
</header>

<div id="helpOverlay">
  <div id="helpPanel">
    <div class="help-top">
      <h2>Help</h2>
      <div class="row" style="flex:0 0 auto; flex-wrap:nowrap;">
        <button class="small-btn" id="btnHelpFullPage" style="flex:0 0 auto;">Open full page</button>
        <button class="small-btn" id="btnCloseHelp" style="flex:0 0 auto;">✕ Close</button>
      </div>
    </div>
    <div id="helpBody"><p>Loading help…</p></div>
  </div>
</div>

<div id="appearanceOverlay">
  <div id="appearancePanel">
    <div class="flex-between" style="margin-bottom:10px;">
      <h2 style="margin:0;">Appearance</h2>
      <button class="small-btn" id="btnCloseAppearance">✕ Close</button>
    </div>
    <div class="row" style="margin-bottom:12px;">
      <button class="small-btn full" id="btnPresetDefault">☀ Default</button>
      <button class="small-btn full" id="btnPresetHC">◐ High Contrast</button>
    </div>
    <div id="colorRows"></div>
    <div class="row" style="margin-top:14px;">
      <button class="danger small-btn full" id="btnResetColors">Reset to Defaults</button>
    </div>
  </div>
</div>

<main>

  <!-- ================= CAPTURE VIEW ================= -->
  <section id="view-capture" class="view active">
    <div class="panel">
      <h2>New Point</h2>
      <label>Boundary</label>
      <select id="boundarySelect"></select>
      <input type="text" id="newBoundaryName" placeholder="New boundary name (e.g. Smith_Tract)" style="display:none; margin-top:6px;">

      <label>Point name / label</label>
      <input type="text" id="pointName" placeholder="e.g. NE corner, rear pin">

      <label>GPS</label>
      <div id="gpsModeFields">
        <div class="gps-readout" id="gpsReadout">Not started.</div>
        <div class="row">
          <button class="primary full" id="btnStartGps">Start GPS Lock</button>
        </div>
      </div>
      <div id="manualModeFields" style="display:none;">
        <div class="row" style="margin-bottom:4px;">
          <button class="small-btn full" id="btnManualBackToGps">← Back to GPS</button>
        </div>
        <label>Latitude (decimal degrees)</label>
        <input type="text" id="manualLat" placeholder="e.g. 37.774900" inputmode="decimal">
        <label>Longitude (decimal degrees)</label>
        <input type="text" id="manualLon" placeholder="e.g. -122.419400" inputmode="decimal">
        <div style="margin-top:8px; text-align:center;">
          <button class="small-btn" id="btnProcessCccNad83" style="width:auto; padding-left:18px; padding-right:18px;">Process CCC &amp; Nad83</button>
        </div>
        <hr class="sep">

        <label>CCC Northing</label>
        <input type="text" id="cccNorthing" placeholder="e.g. 123456.78" inputmode="decimal">
        <label>CCC Easting</label>
        <input type="text" id="cccEasting" placeholder="e.g. 654321.09" inputmode="decimal">
        <div style="margin-top:8px; text-align:center;">
          <button class="small-btn" id="btnProcessLatLonNad83" style="width:auto; padding-left:18px; padding-right:18px;">Process Lat-Lon &amp; Nad83</button>
        </div>
        <hr class="sep">

        <label>Nad83 Northing</label>
        <input type="text" id="nad83Northing" placeholder="e.g. 123456.78" inputmode="decimal">
        <label>Nad83 Easting</label>
        <input type="text" id="nad83Easting" placeholder="e.g. 654321.09" inputmode="decimal">
        <div style="margin-top:8px; text-align:center;">
          <button class="small-btn" id="btnProcessLatLonCcc" style="width:auto; padding-left:18px; padding-right:18px;">Process Lat-Lon &amp; CCC</button>
        </div>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="small-btn full" id="btnToggleManual">📝 Enter Coordinates Manually</button>
      </div>

      <label>Photos (marker close-up + context shot recommended)</label>
      <div class="photothumbs" id="photoThumbs"></div>
      <div class="row">
        <button class="secondary full" id="btnAddPhoto">📷 Add Photo</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" multiple>

      <div id="confidenceField">
        <label>Confidence</label>
        <select id="confidence">
          <option value="good">Good — clear sky, strong signal</option>
          <option value="fair">Fair — some obstruction</option>
          <option value="poor">Poor — canopy/buildings, weak signal</option>
        </select>
      </div>

      <label>Notes (deed tie, nearby features, etc.)</label>
      <textarea id="notes" placeholder="e.g. 15 ft NE of old oak stump, tied to iron pin at road ROW"></textarea>

      <hr class="sep">
      <button class="primary full" id="btnSavePoint" disabled>💾 Save Point</button>
    </div>
  </section>

  <!-- ================= LIST VIEW ================= -->
  <section id="view-list" class="view">
    <div class="panel">
      <div class="flex-between">
        <h2 style="margin:0;">Saved Points</h2>
        <button class="small-btn" id="btnListToNew">➕ New Point</button>
      </div>
      <label style="margin-top:4px;">Filter by boundary</label>
      <div class="row" style="align-items:flex-end;">
        <select id="boundaryFilter" style="width:100%;"></select>
        <button class="danger small-btn" id="btnDeleteBoundary" style="flex:0 0 auto; display:none;">🗑 Delete Boundary</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="small-btn" id="btnExportZip">📦 Export ZIP</button>
        <button class="small-btn" id="btnExport">Backup JSON</button>
        <button class="small-btn" id="btnImport">Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div id="pointList"></div>
  </section>

  <!-- ================= DETAIL VIEW ================= -->
  <section id="view-detail" class="view">
    <div class="panel">
      <button class="small-btn" id="btnBackToList">← Back to list</button>
      <h2 id="detailName" style="margin-top:10px;"></h2>
      <div class="pc-meta" id="detailBoundaryMeta" style="margin-bottom:6px;"></div>
      <div class="gps-readout" id="detailGps"></div>

      <label>Photos</label>
      <div class="photothumbs" id="detailPhotos"></div>
      <div class="row" id="detailAddPhotoRow" style="display:none; margin-bottom:8px;">
        <button class="secondary full" id="btnDetailAddPhoto">📷 Add Photo</button>
      </div>
      <input type="file" id="detailPhotoInput" accept="image/*" capture="environment" style="display:none" multiple>

      <label>Notes</label>
      <p id="detailNotes" style="white-space:pre-wrap; font-size:.92rem;"></p>
      <textarea id="detailNotesEdit" style="display:none;"></textarea>

      <div class="row">
        <button class="secondary full" id="btnNavigateTo">🧭 Navigate to Point</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="small-btn full" id="btnOpenMaps">Open in Maps app</button>
        <button class="small-btn full" id="btnEditPoint">✏️ Edit</button>
      </div>
      <div class="row" id="detailEditActions" style="display:none; margin-top:8px;">
        <button class="primary full" id="btnSaveEdit">💾 Save Changes</button>
        <button class="small-btn full" id="btnCancelEdit">✕ Cancel</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="danger small-btn full" id="btnDeletePoint">Delete Point</button>
      </div>
    </div>
  </section>

  <!-- ================= NAVIGATE VIEW ================= -->
  <section id="view-navigate" class="view">
    <div class="panel">
      <button class="small-btn" id="btnBackFromNav">← Back</button>
      <h2 id="navName" style="margin-top:10px;"></h2>
      <div class="compass-wrap">
        <svg id="compassArrow" width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="66" fill="none" stroke="#00000022" stroke-width="2"/>
          <polygon points="70,14 84,70 70,58 56,70" fill="var(--accent2)"/>
          <circle cx="70" cy="70" r="5" fill="var(--accent)"/>
        </svg>
      </div>
      <div class="distance-big" id="navDistance">-- ft</div>
      <div class="bearing-txt" id="navBearingTxt">Waiting for GPS &amp; compass…</div>
      <div class="row" style="margin-top:8px;">
        <button class="small-btn full" id="btnFlipCompass">🔄 Compass pointing backwards? Tap to flip</button>
      </div>
      <div class="gps-readout" id="navGpsInfo" style="margin-top:14px;"></div>
      <div class="photothumbs" id="navPhotos" style="margin-top:10px;"></div>
      <p style="font-size:.8rem; color:var(--muted); text-align:center;">
        Arrow points toward the saved point relative to your current heading.
        Use the photos above to spot the exact corner once you're close.
      </p>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<div id="lightbox">
  <img id="lightboxImg" src="" alt="Photo">
  <div class="lb-controls">
    <button id="lbPrev">‹ Prev</button>
    <span class="lb-count" id="lbCount"></span>
    <button id="lbNext">Next ›</button>
    <button id="lbClose">✕ Close</button>
  </div>
</div>

<nav class="navbar">
  <button class="navbtn active" data-view="capture"><span class="ic">➕</span>New</button>
  <button class="navbtn" data-view="list"><span class="ic">📋</span>Points</button>
</nav>

<script>
/* ============================================================
   Boundary Point Finder — single-file PWA
   Storage: IndexedDB (points + photo blobs), settings in localStorage
   ============================================================ */

const DB_NAME = 'boundaryFinderDB';
const DB_VERSION = 2;
const STORE = 'points';
const BOUNDARY_STORE = 'boundaries';
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains(STORE)){
        _db.createObjectStore(STORE, { keyPath: 'id' });
      }
      if(!_db.objectStoreNames.contains(BOUNDARY_STORE)){
        _db.createObjectStore(BOUNDARY_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function dbPut(point){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(point);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e);
  });
}
function dbPutBoundary(b){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BOUNDARY_STORE, 'readwrite');
    tx.objectStore(BOUNDARY_STORE).put(b);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbGetAllBoundaries(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BOUNDARY_STORE, 'readonly');
    const req = tx.objectStore(BOUNDARY_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e);
  });
}
function dbDeleteBoundary(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BOUNDARY_STORE, 'readwrite');
    tx.objectStore(BOUNDARY_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

// ---------- utility ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function fmtDist(meters){
  const feet = meters * 3.28084;
  if(feet < 1000) return feet.toFixed(1) + ' ft';
  return (meters).toFixed(0) + ' m';
}
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingTo(lat1, lon1, lat2, lon2){
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}
function compassDirName(deg){
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5) % 16];
}
function sanitizeFilename(s){
  return (s || 'boundary').trim().replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'boundary';
}

// ---------- Lat/Lon <-> NAD83 (Lambert Conformal Conic) <-> CCC ----------
// Fitted from a 34-point control-point dataset (2007 control network),
// restricted to the actual area of interest. The NAD83 Northing/Easting leg
// is a true Lambert Conformal Conic projection (fitted to sub-millimeter RMS
// against the control points, central meridian landed almost exactly on
// Virginia's official -78.5°), so it's treated as exact. The CCC leg is a
// fitted 2nd-order polynomial warp against NAD83 (RMS ~1.5-1.7 ft, max
// residual ~4 ft across the dataset) — restricting the fit to this smaller
// area (dropping 4 far-flung corner points and one other) improved this leg
// substantially over an earlier wide-area fit (RMS ~14 ft, max ~31 ft).
const LCC_A = 6378137.0, LCC_F = 0.003352810681182319; // GRS80/NAD83 ellipsoid
const LCC_E2 = LCC_F * (2 - LCC_F), LCC_E = Math.sqrt(LCC_E2);
const LCC_N = 0.6069247793496589;
const LCC_LAMBDA0 = -78.5 * Math.PI/180;
const LCC_FE = 11482916.67269285;
const LCC_FN = 31091482.35730695;
const LCC_C = 41955860.733147025;

function lccTFunc(phiRad){
  return Math.tan(Math.PI/4 - phiRad/2) / Math.pow((1 - LCC_E*Math.sin(phiRad)) / (1 + LCC_E*Math.sin(phiRad)), LCC_E/2);
}
// Lat/Lon (degrees) -> NAD83 Northing/Easting (feet). Essentially exact.
function latLonToNad83(latDeg, lonDeg){
  const phi = latDeg * Math.PI/180, lam = lonDeg * Math.PI/180;
  const dlam = lam - LCC_LAMBDA0;
  const T = Math.pow(lccTFunc(phi), LCC_N);
  const theta = LCC_N * dlam;
  return {
    easting: LCC_FE + LCC_C*T*Math.sin(theta),
    northing: LCC_FN - LCC_C*T*Math.cos(theta)
  };
}
// NAD83 Northing/Easting (feet) -> Lat/Lon (degrees). Essentially exact.
function nad83ToLatLon(northing, easting){
  const xp = easting - LCC_FE, yp = northing - LCC_FN;
  const rho = Math.sqrt(xp*xp + yp*yp);
  const theta = Math.atan2(xp, -yp);
  let t = Math.pow(rho / LCC_C, 1/LCC_N);
  let phi = Math.PI/2 - 2*Math.atan(t);
  for(let i=0;i<10;i++){
    const esinphi = LCC_E * Math.sin(phi);
    phi = Math.PI/2 - 2*Math.atan(t * Math.pow((1-esinphi)/(1+esinphi), LCC_E/2));
  }
  const lam = theta/LCC_N + LCC_LAMBDA0;
  return { lat: phi*180/Math.PI, lon: lam*180/Math.PI };
}

// Fitted 2nd-order polynomial surfaces, NAD83 <-> CCC (both in feet).
const CCC_MEAN_NE = 10373135.76352941, CCC_MEAN_NN = 3573211.832705882;
const CCC_COEF_E = [22802.457873000727, 99890.98349841493, -4026.5429591044285, 14.655407233288313, 361.8590642806217, -14.28623810232836];
const CCC_COEF_N = [-9142.878671294284, 4027.4443267920738, 99921.92143790842, -181.4104370517706, 14.764951488817786, -1.0721688464790453];
const NAD_MEAN_CE = 22789.453244117645, NAD_MEAN_CN = -9278.740602941178;
const NAD_COEF_E = [10373117.353241133, 99946.6955897937, 4027.3247089760357, 7.074904160060544, -362.91786910661796, -0.4455904599982548];
const NAD_COEF_N = [3573076.6022555158, -4028.4890216264635, 99914.84152691884, 181.643621925251, 14.859077560626304, 0.80034552103989];

function poly2Eval(coef, x0, y0, meanX, meanY){
  const x = (x0-meanX)/1e5, y = (y0-meanY)/1e5;
  return coef[0] + coef[1]*x + coef[2]*y + coef[3]*x*x + coef[4]*x*y + coef[5]*y*y;
}
// NAD83 Northing/Easting (feet) -> CCC Northing/Easting (feet)
function nad83ToCcc(northing, easting){
  return {
    easting: poly2Eval(CCC_COEF_E, easting, northing, CCC_MEAN_NE, CCC_MEAN_NN),
    northing: poly2Eval(CCC_COEF_N, easting, northing, CCC_MEAN_NE, CCC_MEAN_NN)
  };
}
// CCC Northing/Easting (feet) -> NAD83 Northing/Easting (feet)
function cccToNad83(northing, easting){
  return {
    easting: poly2Eval(NAD_COEF_E, easting, northing, NAD_MEAN_CE, NAD_MEAN_CN),
    northing: poly2Eval(NAD_COEF_N, easting, northing, NAD_MEAN_CE, NAD_MEAN_CN)
  };
}

// downscale + compress a File/Blob image to keep IndexedDB size sane
function compressImage(file, maxDim=1280, quality=0.75){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxDim){ height *= maxDim/width; width = maxDim; }
      else if(height > maxDim){ width *= maxDim/height; height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result); // base64 dataURL
        fr.readAsDataURL(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function rgbToHex(rgbStr){
  const m = rgbStr.match(/\d+/g);
  if(!m) return '#000000';
  return '#' + m.slice(0,3).map(n => (+n).toString(16).padStart(2,'0')).join('');
}
function applyColors(colors){
  Object.keys(colors).forEach(k => document.documentElement.style.setProperty(k, colors[k]));
}
function getCurrentColors(){
  const cs = getComputedStyle(document.documentElement);
  const out = {};
  THEME_VARS.forEach(v => {
    const val = cs.getPropertyValue(v.key).trim();
    out[v.key] = val.startsWith('#') ? val : rgbToHex(val);
  });
  return out;
}
function saveColors(colors){
  localStorage.setItem('bf_customColors', JSON.stringify(colors));
  applyColors(colors);
}
function renderColorRows(){
  const current = getCurrentColors();
  const wrap = document.getElementById('colorRows');
  wrap.innerHTML = THEME_VARS.map(v => `
    <div class="color-row">
      <label for="color_${v.key}">${v.label}</label>
      <input type="color" id="color_${v.key}" data-key="${v.key}" value="${current[v.key]}">
    </div>
  `).join('');
  wrap.querySelectorAll('input[type=color]').forEach(input => {
    input.addEventListener('input', () => {
      const colors = getCurrentColors();
      colors[input.dataset.key] = input.value;
      saveColors(colors);
    });
  });
}

let allBoundaries = [];
const boundarySelect = document.getElementById('boundarySelect');
const newBoundaryName = document.getElementById('newBoundaryName');
const boundaryFilter = document.getElementById('boundaryFilter');

async function loadBoundaries(){
  allBoundaries = (await dbGetAllBoundaries()).sort((a,b) => a.name.localeCompare(b.name));
  return allBoundaries;
}

function populateBoundarySelect(){
  const lastId = localStorage.getItem('bf_lastBoundary');
  boundarySelect.innerHTML =
    allBoundaries.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('') +
    `<option value="__new__">➕ New boundary…</option>`;
  if(allBoundaries.length === 0){
    boundarySelect.value = '__new__';
  } else if(lastId && allBoundaries.some(b => b.id === lastId)){
    boundarySelect.value = lastId;
  } else {
    boundarySelect.value = allBoundaries[0].id;
  }
  newBoundaryName.style.display = boundarySelect.value === '__new__' ? 'block' : 'none';
}
boundarySelect.onchange = () => {
  newBoundaryName.style.display = boundarySelect.value === '__new__' ? 'block' : 'none';
};

function populateBoundaryFilter(){
  const current = boundaryFilter.value;
  boundaryFilter.innerHTML =
    `<option value="">All boundaries</option>` +
    allBoundaries.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
  if(current && allBoundaries.some(b => b.id === current)) boundaryFilter.value = current;
  document.getElementById('btnDeleteBoundary').style.display = boundaryFilter.value ? 'block' : 'none';
}
boundaryFilter.onchange = () => {
  document.getElementById('btnDeleteBoundary').style.display = boundaryFilter.value ? 'block' : 'none';
  renderList();
};

document.getElementById('btnDeleteBoundary').onclick = async () => {
  const id = boundaryFilter.value;
  if(!id) return;
  const b = allBoundaries.find(x => x.id === id);
  if(!b) return;
  const pts = (await dbGetAll()).filter(p => p.boundaryId === id);
  const photoCount = pts.reduce((n,p) => n + (p.photos||[]).length, 0);
  const ok = confirm(
    `Delete boundary "${b.name}"?\n\nThis will permanently delete ${pts.length} point(s) and ${photoCount} photo(s). This cannot be undone.`
  );
  if(!ok) return;
  for(const p of pts) await dbDelete(p.id);
  await dbDeleteBoundary(id);
  if(localStorage.getItem('bf_lastBoundary') === id) localStorage.removeItem('bf_lastBoundary');
  toast(`Deleted "${b.name}" and ${pts.length} point(s).`);
  boundaryFilter.value = '';
  await loadBoundaries();
  populateBoundarySelect();
  renderList();
};

// resolves the boundary to save against: existing selection, or creates
// (or reuses, if the typed name matches an existing one) a new boundary
async function resolveBoundaryForSave(){
  if(boundarySelect.value !== '__new__'){
    return allBoundaries.find(b => b.id === boundarySelect.value) || null;
  }
  const typed = newBoundaryName.value.trim();
  if(!typed){ toast('Enter a name for the new boundary.'); return null; }
  const existing = allBoundaries.find(b => b.name.toLowerCase() === typed.toLowerCase());
  if(existing) return existing;
  const b = { id: uid(), name: typed, createdAt: Date.now() };
  await dbPutBoundary(b);
  await loadBoundaries();
  return b;
}

function parseManualCoords(){
  const lat = parseFloat(manualLat.value);
  const lon = parseFloat(manualLon.value);
  if(isNaN(lat) || isNaN(lon)) return null;
  if(lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
  return { lat, lon };
}

function setEntryMode(mode){
  entryMode = mode;
  const manual = mode === 'manual';
  gpsModeFields.style.display = manual ? 'none' : 'block';
  manualModeFields.style.display = manual ? 'block' : 'none';
  confidenceField.style.display = manual ? 'none' : 'block';
  btnToggleManual.textContent = manual ? '📡 Use GPS Instead' : '📝 Enter Coordinates Manually';
  updateSaveButtonState();
}

manualLon.addEventListener('input', updateSaveButtonState);

// Input: Latitude/Longitude -> fills Nad83 Northing/Easting and CCC Northing/Easting
document.getElementById('btnProcessCccNad83').onclick = () => {
  const lat = parseFloat(manualLat.value);
  const lon = parseFloat(manualLon.value);
  if(isNaN(lat) || isNaN(lon)){ toast('Enter Latitude and Longitude first.'); return; }
  const nad = latLonToNad83(lat, lon);
  document.getElementById('nad83Northing').value = nad.northing.toFixed(2);
  document.getElementById('nad83Easting').value = nad.easting.toFixed(2);
  const ccc = nad83ToCcc(nad.northing, nad.easting);

  document.getElementById('cccEasting').value = ccc.easting.toFixed(2);

};

function updateSaveButtonState(){
  if(entryMode === 'manual'){
    btnSavePoint.disabled = parseManualCoords() === null;
  } else {
    btnSavePoint.disabled = !bestFix;
  }
}

function accClass(acc){
  if(acc == null) return '';
  if(acc <= 5) return 'acc-good';
  if(acc <= 12) return 'acc-ok';
  return 'acc-poor';
}

function updateGpsReadout(){
  if(!bestFix){
    gpsReadout.textContent = gpsSamples.length
      ? `Reading… (${gpsSamples.length} samples, settling)`
      : 'Not started.';
    updateSaveButtonState();
    return;
  }
  gpsReadout.innerHTML =
    `Lat: ${bestFix.lat.toFixed(7)}\nLon: ${bestFix.lon.toFixed(7)}\n` +
    `Accuracy: <span class="accbadge ${accClass(bestFix.acc)}">±${bestFix.acc.toFixed(1)} m</span>  ` +
    `(${gpsSamples.length} samples)`;
  updateSaveButtonState();
}

btnStartGps.onclick = () => {
  if(!navigator.geolocation){ toast('Geolocation not supported on this device.'); return; }
  gpsSamples = []; bestFix = null; btnSavePoint.disabled = true;
  btnStartGps.disabled = true; btnStartGps.textContent = 'Locking… (settling ~20s)';
  updateGpsReadout();

  if(gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
  gpsWatchId = navigator.geolocation.watchPosition(pos => {
    const s = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, ts: Date.now() };
    gpsSamples.push(s);
    if(!bestFix || s.acc < bestFix.acc) bestFix = s;
    updateGpsReadout();
  }, err => {
    toast('GPS error: ' + err.message);
    btnStartGps.disabled = false; btnStartGps.textContent = 'Start GPS Lock';
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });

  setTimeout(() => {
    if(gpsWatchId !== null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
    btnStartGps.disabled = false; btnStartGps.textContent = 'Re-lock GPS';
    if(bestFix) toast('GPS settled. Best accuracy ±' + bestFix.acc.toFixed(1) + ' m');
  }, 20000);
};

btnSavePoint.onclick = async () => {
  let coords, accuracy, sampleCount, isManual;
  if(entryMode === 'manual'){
    const parsed = parseManualCoords();
    if(!parsed){ toast('Enter a valid latitude (-90 to 90) and longitude (-180 to 180).'); return; }
    coords = parsed; accuracy = null; sampleCount = 0; isManual = true;
  } else {
    if(!bestFix){ toast('Get a GPS fix first.'); return; }
    coords = { lat: bestFix.lat, lon: bestFix.lon }; accuracy = bestFix.acc; sampleCount = gpsSamples.length; isManual = false;
  }

  const boundary = await resolveBoundaryForSave();
  if(!boundary) return;

  const existingForBoundary = (await dbGetAll()).filter(p => p.boundaryId === boundary.id);
  const nextPointNumber = existingForBoundary.reduce((max,p) => Math.max(max, p.pointNumber||0), 0) + 1;

  // Preserve the original CCC Northing/Easting inputs, if this point came
  // from the CCC conversion buttons — kept for future recalibration even
  // after the derived lat/lon is what's actually used for navigation.
  let cccNorthingVal = null, cccEastingVal = null;
  if(isManual){
    const n = parseFloat(document.getElementById('cccNorthing').value);
    const e = parseFloat(document.getElementById('cccEasting').value);
    if(!isNaN(n)) cccNorthingVal = n;
    if(!isNaN(e)) cccEastingVal = e;
  }

  const name = document.getElementById('pointName').value.trim() || ('Point ' + nextPointNumber);
  const point = {
    id: uid(),
    boundaryId: boundary.id,
    boundaryName: boundary.name,
    pointNumber: nextPointNumber,
    name,
    lat: coords.lat,
    lon: coords.lon,
    accuracy,
    sampleCount,
    manual: isManual,
    cccNorthing: cccNorthingVal,
    cccEasting: cccEastingVal,
    confidence: isManual ? 'manual' : document.getElementById('confidence').value,
    notes: document.getElementById('notes').value.trim(),
    photos: capturePhotos.slice(),
    createdAt: Date.now()
  };
  await dbPut(point);
  localStorage.setItem('bf_lastBoundary', boundary.id);
  toast(`Point saved: ${boundary.name} · pt ${nextPointNumber}`);

  // reset capture form (keep boundary selected for the next point on the same job)
  document.getElementById('pointName').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('confidence').value = 'good';
  capturePhotos = []; renderCapturePhotos();
  gpsSamples = []; bestFix = null; updateGpsReadout();
  btnStartGps.textContent = 'Start GPS Lock';
  manualLat.value = ''; manualLon.value = '';
  document.getElementById('cccNorthing').value = '';
  document.getElementById('cccEasting').value = '';
  document.getElementById('nad83Northing').value = '';
  document.getElementById('nad83Easting').value = '';
  setEntryMode('gps');
  await loadBoundaries();
  populateBoundarySelect();
  boundarySelect.value = boundary.id;
  newBoundaryName.value = '';
  newBoundaryName.style.display = 'none';

  showView('list');
};

    card.className = 'pointcard';

    const boundaryTag = p.boundaryName ? `${escapeHtml(p.boundaryName)} · pt ${p.pointNumber||'?'}` : '(no boundary)';
    const accBit = p.accuracy != null
      ? `<span class="accbadge ${accClass(p.accuracy)}">±${p.accuracy.toFixed(1)} m</span>`
      : `<span class="accbadge" style="background:var(--muted);">manual</span>`;
    card.innerHTML = `

// ---------- lightbox (tap-to-enlarge photos) ----------
let lbPhotos = [];
let lbIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lbCount = document.getElementById('lbCount');

function openLightbox(photos, index){
  lbPhotos = photos;
  lbIndex = index;
  renderLightbox();
  lightbox.classList.add('show');
}
function renderLightbox(){
  lightboxImg.src = lbPhotos[lbIndex];
  resetZoom();
  lbCount.textContent = (lbIndex+1) + ' / ' + lbPhotos.length;
  document.getElementById('lbPrev').style.visibility = lbPhotos.length > 1 ? 'visible' : 'hidden';
  document.getElementById('lbNext').style.visibility = lbPhotos.length > 1 ? 'visible' : 'hidden';
}
document.getElementById('lbPrev').onclick = () => { lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length; renderLightbox(); };
document.getElementById('lbNext').onclick = () => { lbIndex = (lbIndex + 1) % lbPhotos.length; renderLightbox(); };
document.getElementById('lbClose').onclick = () => lightbox.classList.remove('show');
lightbox.addEventListener('click', e => { if(e.target === lightbox) lightbox.classList.remove('show'); });

// ---------- pinch-zoom / pan / double-tap ----------
let zScale = 1, zPanX = 0, zPanY = 0;
const ZOOM_MIN = 1, ZOOM_MAX = 5;

function applyTransform(){
  lightboxImg.style.transform = `translate(${zPanX}px, ${zPanY}px) scale(${zScale})`;
}
function resetZoom(){
  zScale = 1; zPanX = 0; zPanY = 0;
  applyTransform();
}
function clampPan(){
  // keep image roughly on-screen once zoomed; simple bounds based on scale
  const maxPan = (zScale - 1) * (lightboxImg.clientWidth / 2 + 40);
  zPanX = Math.max(-maxPan, Math.min(maxPan, zPanX));
  const maxPanY = (zScale - 1) * (lightboxImg.clientHeight / 2 + 40);
  zPanY = Math.max(-maxPanY, Math.min(maxPanY, zPanY));
}

let touchMode = null; // 'pan' | 'pinch' | 'swipe' | null
let touchStartX = null;
let lastTouchX = 0, lastTouchY = 0;
let pinchStartDist = 0, pinchStartScale = 1;
let lastTapTime = 0;

function touchDist(t1, t2){
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}

lightboxImg.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    touchMode = 'pinch';
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = zScale;
  } else if(e.touches.length === 1){
    const now = Date.now();
    if(now - lastTapTime < 300){
      // double tap: toggle zoom
      if(zScale > 1) resetZoom();
      else { zScale = 2.5; applyTransform(); }
      touchMode = null;
      lastTapTime = 0;
      return;
    }
    lastTapTime = now;
    if(zScale > 1){
      touchMode = 'pan';
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    } else {
      touchMode = 'swipe';
      touchStartX = e.touches[0].clientX;
    }
  }
}, { passive: true });

lightboxImg.addEventListener('touchmove', e => {
  if(touchMode === 'pinch' && e.touches.length === 2){
    const dist = touchDist(e.touches[0], e.touches[1]);
    zScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartScale * (dist / pinchStartDist)));
    clampPan();
    applyTransform();
  } else if(touchMode === 'pan' && e.touches.length === 1){
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    zPanX += dx; zPanY += dy;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    clampPan();
    applyTransform();
  }
}, { passive: true });

lightboxImg.addEventListener('touchend', e => {
  if(touchMode === 'swipe' && touchStartX != null && e.changedTouches.length){
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40 && lbPhotos.length > 1){
      if(dx < 0) lbIndex = (lbIndex + 1) % lbPhotos.length;
      else lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
      renderLightbox();
    }
  }
  if(zScale <= 1.02) resetZoom(); // snap back if barely zoomed
  touchMode = null;
  touchStartX = null;
});

// desktop: wheel to zoom, double-click to toggle
lightboxImg.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = -e.deltaY * 0.002;
  zScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zScale + delta));
  clampPan();
  applyTransform();
}, { passive: false });
lightboxImg.addEventListener('dblclick', () => {
  if(zScale > 1) resetZoom();
  else { zScale = 2.5; applyTransform(); }
});

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

let currentDetailPoint = null;
let detailEditing = false;
let editPhotos = []; // working copy of photos while editing; discarded on Cancel

function openDetail(id){
  currentDetailId = id;
  const p = allPoints.find(x => x.id === id);
  if(!p) return;
  currentDetailPoint = p;
  detailEditing = false;
  editPhotos = [];
  renderDetail();
  showView('detail');
}

function renderDetail(){
  const p = currentDetailPoint;
  if(!p) return;
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailBoundaryMeta').textContent =
    p.boundaryName ? `${p.boundaryName} · Point #${p.pointNumber||'?'}` : '(no boundary assigned)';
  document.getElementById('detailGps').innerHTML =
    `Lat: ${p.lat.toFixed(7)}\nLon: ${p.lon.toFixed(7)}\n` +
    (p.accuracy != null
      ? `Accuracy: <span class="accbadge ${accClass(p.accuracy)}">±${p.accuracy.toFixed(1)} m</span> (${p.sampleCount||1} samples)\n`
      : `Source: <span class="accbadge" style="background:var(--muted);">manually entered</span>\n`) +
    ((p.cccNorthing != null || p.cccEasting != null)
      ? `CCC Northing: ${p.cccNorthing != null ? p.cccNorthing : '—'}   CCC Easting: ${p.cccEasting != null ? p.cccEasting : '—'}\n`
      : '') +
    `Confidence: ${p.confidence}\nSaved: ${new Date(p.createdAt).toLocaleString()}`;

  renderDetailPhotosBlock();

  const notesP = document.getElementById('detailNotes');
  const notesEdit = document.getElementById('detailNotesEdit');
  if(detailEditing){
    notesP.style.display = 'none';
    notesEdit.style.display = 'block';
    notesEdit.value = p.notes || '';
  } else {
    notesP.style.display = 'block';
    notesEdit.style.display = 'none';
    notesP.textContent = p.notes || '(no notes)';
  }

  document.getElementById('detailAddPhotoRow').style.display = detailEditing ? 'flex' : 'none';
  document.getElementById('btnEditPoint').style.display = detailEditing ? 'none' : 'block';
  document.getElementById('detailEditActions').style.display = detailEditing ? 'flex' : 'none';
}

function renderDetailPhotosBlock(){
  const wrap = document.getElementById('detailPhotos');
  wrap.innerHTML = '';
  const photos = detailEditing ? editPhotos : (currentDetailPoint.photos || []);
  if(photos.length === 0 && !detailEditing){
    wrap.innerHTML = '<span style="color:var(--muted);font-size:.85rem;">No photos</span>';
    return;
  }
  photos.forEach((src, i) => {
    if(detailEditing){
      const d = document.createElement('div'); d.className = 'thumbwrap';
      d.innerHTML = `<img src="${src}" data-i="${i}"><button class="rm" data-i="${i}">✕</button>`;
      wrap.appendChild(d);
    } else {
      const img = document.createElement('img');
      img.src = src; img.dataset.i = i;
      wrap.appendChild(img);
    }
  });
  wrap.querySelectorAll('img').forEach(img => {
    img.onclick = () => openLightbox(photos, +img.dataset.i);
  });
  if(detailEditing){
    wrap.querySelectorAll('.rm').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); editPhotos.splice(+btn.dataset.i, 1); renderDetailPhotosBlock(); };
    });
  }
}

document.getElementById('btnEditPoint').onclick = () => {
  detailEditing = true;
  editPhotos = (currentDetailPoint.photos || []).slice();
  renderDetail();
};
document.getElementById('btnCancelEdit').onclick = () => {
  detailEditing = false;
  editPhotos = [];
  renderDetail();
};
document.getElementById('btnSaveEdit').onclick = async () => {
  const updated = {
    ...currentDetailPoint,
    notes: document.getElementById('detailNotesEdit').value.trim(),
    photos: editPhotos.slice()
  };
  await dbPut(updated);
  currentDetailPoint = updated;
  const idx = allPoints.findIndex(x => x.id === updated.id);
  if(idx !== -1) allPoints[idx] = updated;
  detailEditing = false;
  toast('Point updated.');
  renderDetail();
};
document.getElementById('btnDetailAddPhoto').onclick = () => document.getElementById('detailPhotoInput').click();

  const input = document.getElementById('detailPhotoInput');
  const files = Array.from(input.files || []);
  for(const f of files){
    try{
      const dataUrl = await compressImage(f);
      editPhotos.push(dataUrl);

  renderDetailPhotosBlock();

document.getElementById('btnBackToList').onclick = () => showView('list');
document.getElementById('btnDeletePoint').onclick = async () => {

document.getElementById('btnOpenMaps').onclick = () => {

// ---------- export / import ----------
document.getElementById('btnExport').onclick = async () => {
  const pts = await dbGetAll();
  const blob = new Blob([JSON.stringify(pts, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'boundary_points_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Backed up ' + pts.length + ' point(s).');
};
document.getElementById('btnImport').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async () => {
  const f = document.getElementById('importFile').files[0];
  if(!f) return;
  try{
    const text = await f.text();
    const pts = JSON.parse(text);
    if(!Array.isArray(pts)) throw new Error('bad format');
    // recreate any boundaries referenced by imported points that don't exist locally yet
    const knownIds = new Set((await dbGetAllBoundaries()).map(b => b.id));
    for(const p of pts){
      if(p.boundaryId && p.boundaryName && !knownIds.has(p.boundaryId)){
        await dbPutBoundary({ id: p.boundaryId, name: p.boundaryName, createdAt: p.createdAt || Date.now() });
        knownIds.add(p.boundaryId);
      }
    }
    for(const p of pts){ if(p.id) await dbPut(p); }
    toast('Imported ' + pts.length + ' point(s).');
    renderList();
  }catch(e){ toast('Import failed: invalid file.'); }
  document.getElementById('importFile').value = '';
};

document.getElementById('btnExportZip').onclick = async () => {
  if(typeof JSZip === 'undefined'){ toast('ZIP library failed to load — check your connection.'); return; }
  const filterId = boundaryFilter.value;
  const pts = await dbGetAll();
  const boundaries = await dbGetAllBoundaries();
  const scopeBoundaries = filterId ? boundaries.filter(b => b.id === filterId) : boundaries;
  if(scopeBoundaries.length === 0){ toast('No boundaries to export.'); return; }

  const zip = new JSZip();
  let totalPhotos = 0;

  for(const b of scopeBoundaries){
    const folderName = sanitizeFilename(b.name);
    const folder = zip.folder(folderName);
    const boundaryPoints = pts.filter(p => p.boundaryId === b.id).sort((a,c) => (a.pointNumber||0)-(c.pointNumber||0));
    const manifest = [];
    for(const p of boundaryPoints){
      const photoFiles = [];
      (p.photos||[]).forEach((dataUrl, i) => {
        const base64 = (dataUrl.split(',')[1]) || '';
        const filename = `${folderName}_pt${p.pointNumber}_${i+1}.jpg`;
        folder.file(filename, base64, { base64: true });
        photoFiles.push(filename);
        totalPhotos++;
      });
      manifest.push({
        pointNumber: p.pointNumber, name: p.name, lat: p.lat, lon: p.lon,
        accuracy: p.accuracy, confidence: p.confidence, notes: p.notes,
        cccNorthing: p.cccNorthing != null ? p.cccNorthing : undefined,
        cccEasting: p.cccEasting != null ? p.cccEasting : undefined,
        createdAt: new Date(p.createdAt).toISOString(), photos: photoFiles
      });
    }
    folder.file('points.json', JSON.stringify(manifest, null, 2));
  }

  if(totalPhotos === 0 && scopeBoundaries.every(b => pts.every(p => p.boundaryId !== b.id))){
    toast('No points found for that boundary.');
    return;
  }

  toast('Building ZIP…');
  const blob = await zip.generateAsync({ type: 'blob' });
  const zipName = filterId
    ? sanitizeFilename(scopeBoundaries[0].name) + '.zip'
    : 'all_boundaries_' + new Date().toISOString().slice(0,10) + '.zip';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = zipName;
  a.click();
  toast('Exported ' + zipName);
};

// NAVIGATE
// ============================================================
let navWatchId = null;
let navHeading = null;
let navTargetPoint = null;

document.getElementById('btnNavigateTo').onclick = () => {
  navTargetPoint = allPoints.find(x => x.id === currentDetailId);
  if(!navTargetPoint) return;
  document.getElementById('navName').textContent = 'To: ' + navTargetPoint.name;
  const nPhotos = navTargetPoint.photos || [];
  document.getElementById('navPhotos').innerHTML =
    nPhotos.map((src,i)=>`<img src="${src}" data-i="${i}">`).join('');
  document.getElementById('navPhotos').querySelectorAll('img').forEach(img => {
    img.onclick = () => openLightbox(nPhotos, +img.dataset.i);
  });
  startNavigation();
  showView('navigate');
};
document.getElementById('btnBackFromNav').onclick = () => showView('detail');
document.getElementById('btnFlipCompass').onclick = () => {
  const flipped = localStorage.getItem('bf_compassFlip') === '1';
  localStorage.setItem('bf_compassFlip', flipped ? '0' : '1');
  toast(flipped ? 'Compass flip removed.' : 'Compass flipped 180°.');
};

function startNavigation(){
  stopNavigation();
  if(!navigator.geolocation){ toast('Geolocation not supported.'); return; }
  navWatchId = navigator.geolocation.watchPosition(pos => {
    updateNav(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
  }, err => {
    document.getElementById('navBearingTxt').textContent = 'GPS error: ' + err.message;
  }, { enableHighAccuracy:true, maximumAge:1000, timeout:20000 });

  // device orientation for compass heading
  if(window.DeviceOrientationEvent){
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(state => {
        if(state === 'granted') window.addEventListener('deviceorientationabsolute', onOrientation, true) ||
                                 window.addEventListener('deviceorientation', onOrientation, true);
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientationabsolute', onOrientation, true);
      window.addEventListener('deviceorientation', onOrientation, true);
    }
  }
}
function stopNavigation(){
  if(navWatchId !== null){ navigator.geolocation.clearWatch(navWatchId); navWatchId = null; }
  window.removeEventListener('deviceorientationabsolute', onOrientation, true);
  window.removeEventListener('deviceorientation', onOrientation, true);
  navHeading = null;
}
// Tilt-compensated compass heading from raw device orientation angles.
// Using alpha alone (the naive "360 - alpha" approach) only works when the
// phone is lying flat; held upright (normal walking-with-phone posture),
// that breaks down and can flip by up to 180° depending on tilt angle.
// This combines alpha/beta/gamma properly so heading stays correct at any
// tilt. (iOS's webkitCompassHeading already does this internally, so it's
// left untouched below.)
function computeCompassHeading(alpha, beta, gamma){
  const d2r = Math.PI / 180;
  const x = beta  ? beta  * d2r : 0;
  const y = gamma ? gamma * d2r : 0;
  const z = alpha ? alpha * d2r : 0;
  const cX = Math.cos(x), cY = Math.cos(y), cZ = Math.cos(z);
  const sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);

  const Vx = -cZ * sY - sZ * sX * cY;
  const Vy = -sZ * sY + cZ * sX * cY;

  let heading = Math.atan(Vx / Vy);
  if(Vy < 0) heading += Math.PI;
  else if(Vx < 0) heading += 2 * Math.PI;

  return ((heading * 180 / Math.PI) % 360 + 360) % 360;
}

function onOrientation(e){
  let heading = null;
  if(e.webkitCompassHeading != null){
    heading = e.webkitCompassHeading; // iOS: already tilt-compensated
  } else if(e.alpha != null){
    const beta = e.beta || 0, gamma = e.gamma || 0;
    const isFlat = Math.abs(beta) < 25 && Math.abs(gamma) < 25;
    if(isFlat){
      // Phone lying flat, screen up: on most Android/Chrome combos the
      // "absolute" alpha value IS already a true compass heading
      // (clockwise from north) — no inversion needed. The old
      // "360 - alpha" formula is a mirror-flip here: correct only when
      // facing exactly north/south, off by up to 180° facing east/west.
      heading = e.alpha;
    } else if(e.beta != null && e.gamma != null){
      // Phone tilted/upright: use the full tilt-compensated formula.
      heading = computeCompassHeading(e.alpha, e.beta, e.gamma);
    }
  }
  if(heading == null) return;
  heading = ((heading % 360) + 360) % 360;
  if(localStorage.getItem('bf_compassFlip') === '1') heading = (heading + 180) % 360;
  navHeading = heading;
}

let lastNavFix = null;
function updateNav(lat, lon, acc){
  lastNavFix = {lat, lon, acc};
  if(!navTargetPoint) return;
  const dist = haversine(lat, lon, navTargetPoint.lat, navTargetPoint.lon);
  const brg = bearingTo(lat, lon, navTargetPoint.lat, navTargetPoint.lon);
  document.getElementById('navDistance').textContent = fmtDist(dist);

  const arrow = document.getElementById('compassArrow');
  let rotate = brg;
  let headingNote = 'Compass heading unavailable — arrow shows true bearing from north.';
  if(navHeading != null){
    rotate = (brg - navHeading + 360) % 360;
    headingNote = `Facing ${compassDirName(navHeading)} · target is ${compassDirName(brg)} (${brg.toFixed(0)}°)`;
  } else {
    headingNote = `Target bearing: ${compassDirName(brg)} (${brg.toFixed(0)}° true)`;
  }
  arrow.style.transform = `rotate(${rotate}deg)`;
  document.getElementById('navBearingTxt').textContent = headingNote;
  const targetAccBit = navTargetPoint.accuracy != null
    ? `<span class="accbadge ${accClass(navTargetPoint.accuracy)}">±${navTargetPoint.accuracy.toFixed(1)} m</span>`
    : `<span class="accbadge" style="background:var(--muted);">manual entry</span>`;
  document.getElementById('navGpsInfo').innerHTML =
    `Your position: ${lat.toFixed(7)}, ${lon.toFixed(7)}\n` +
    `Your GPS accuracy: <span class="accbadge ${accClass(acc)}">±${acc.toFixed(1)} m</span>\n` +
    `Target accuracy: ${targetAccBit}`;

  if(dist < 3){
    document.getElementById('navBearingTxt').textContent = "You're within a few meters — use the photos to spot the exact corner.";
  }
}

}).catch(e => {

});
